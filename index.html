<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrDer-Super</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="startScreen">
    <h1 id="gameTitle">DrDer-Super</h1>
    <p class="subtitle">مغامرة القفز الكبرى</p>
    <button id="startBtn">ابدأ اللعب</button>
    <div class="controls-info">
      <p>⬅️ ➡️ للحركة</p>
      <p>مسطرة المسافة أو ⬆️ للقفز</p>
      <p>اجمع العملات، تفادى الأعداء، وصل للعلم 🚩</p>
    </div>
  </div>

  <div id="ui">
    <div>🪙 العملات: <span id="coins">0</span></div>
    <div>❤️ الأرواح: <span id="lives">3</span></div>
    <div>🏁 المرحلة: <span id="level">1</span> / <span id="totalLevels">30</span></div>
  </div>

  <div id="gameWrapper">
    <canvas id="game" width="800" height="450"></canvas>
    <div id="msg"></div>
  </div>

  <div id="hint">الأسهم للحركة | مسطرة المسافة أو ↑ للقفز | Enter للمتابعة بعد كل مرحلة</div>

  <script src="levels.js"></script>
  <script src="engine.js"></script>
</body>
</html>
